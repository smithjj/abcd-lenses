<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABCD Gaussian Beam Propagator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABCD Beam">
<style>
/* ── Page layout ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 20px; }
.container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 28px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }

/* ── Input controls ── */
.controls { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 20px; }
.control-group { flex: 1; min-width: 240px; }
.control-group h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #eef2f6; }
.field { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.field label { min-width: 120px; color: #374151; }
.field input[type="number"] { width: 90px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; transition: border-color .15s; }
.field input[type="number"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

/* ── Lens rows (dynamic) ── */
.lens-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
.lens-row:last-child { border-bottom: none; }
.lens-label { font-weight: 600; font-size: 13px; min-width: 48px; color: #374151; }
.lens-row .field { margin-bottom: 0; }
.lens-row .field label { min-width: auto; font-size: 12px; color: #6b7280; }
.lens-row input[type="number"] { width: 72px; }

/* ── Action bar ── */
.actions { display: flex; align-items: center; gap: 16px; margin: 16px 0 20px; flex-wrap: wrap; }
.btn { padding: 8px 24px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
.btn:hover { background: #2563eb; }
.btn:active { background: #1d4ed8; }
.toggle-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; cursor: pointer; }
.toggle-label input { margin: 0; }
/* ── Add / remove lens buttons ── */
.btn-add-lens { padding: 2px 10px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 10px; vertical-align: middle; font-weight: 500; }
.btn-add-lens:hover { background: #2563eb; }

/* ── Presets ── */
.presets { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 13px; color: #374151; }
.presets select { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; background: #fff; min-width: 180px; }
.presets select:focus { outline: none; border-color: #3b82f6; }
.btn-preset { padding: 5px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn-preset:hover { background: #2563eb; }
.btn-preset-danger { background: #ef4444; }
.btn-preset-danger:hover { background: #dc2626; }
.lens-remove { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 0 6px; line-height: 1; font-weight: 700; transition: color .15s; }
.lens-remove:hover { color: #dc2626; }

/* ── Plot canvas & overlays ── */
.plot-wrap { position: relative; width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: #fafbfc; }
canvas { width: 100%; height: 520px; display: block; cursor: crosshair; }
.zoom-rect { position: absolute; top: 0; background: rgba(59,130,246,0.10); border: 1px solid rgba(59,130,246,0.45); pointer-events: none; display: none; z-index: 1; }
.v-cursor { position: absolute; top: 0; width: 1px; background: rgba(0,0,0,0.25); pointer-events: none; display: none; }
.cursor-info { position: absolute; background: rgba(30,30,40,0.88); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; pointer-events: none; display: none; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── Results table ── */
.results { margin-top: 18px; }
.results h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; margin-bottom: 8px; }
.results table { width: 100%; border-collapse: collapse; font-size: 13px; }
.results th, .results td { padding: 7px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
.results th { font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; background: #f9fafb; }
.results td { color: #1f2937; }
.results tr:last-child td { border-bottom: none; }
</style>

<body>
<div class="container">
  <h1>ABCD Gaussian Beam Propagator</h1>
  <div class="subtitle">Ray-transfer-matrix analysis of Gaussian beam propagation through paraxial optical systems</div>

  <div class="controls">
    <div class="control-group">
      <h3>Beam Parameters</h3>
      <div class="field"><label>Wavelength λ (nm)</label><input type="number" id="wavelength" value="633" min="1" step="1" title="Free-space wavelength in nanometres"></div>
      <div class="field"><label>Initial w₀ (mm)</label><input type="number" id="w0" value="0.5" min="0.001" step="0.01" title="Beam half-width at z = 0 (x-axis)"></div>
      <div class="field"><label>Initial w₀y (mm)</label><input type="number" id="w0y" value="0.5" min="0.001" step="0.01" title="Beam half-width at z = 0 (y-axis); set ≠ w₀ for elliptical beams"></div>
      <div class="field"><label>M²</label><input type="number" id="M2" value="1" min="1" step="0.1" title="Beam propagation factor (1 = ideal Gaussian)"></div>
      <div class="field"><label>Initial R₀ (mm)</label><input type="number" id="R0" value="0" step="10" title="0 = infinite (plane wavefront)"></div>
      <div class="field"><label>Initial R₀y (mm)</label><input type="number" id="R0y" value="0" step="10" title="0 = infinite (plane wavefront)"></div>
      <div class="field"><label>Total length (mm)</label><input type="number" id="totalLength" value="300" min="1" step="10" title="Propagation distance to simulate"></div>
      <div class="field"><label>Samples</label><input type="number" id="samples" value="4096" min="50" max="50000" step="1" title="Number of z-sample points; higher = smoother curves. Each active lens adds a before/after duplicate, so total plotted points ≈ Samples + 2×lenses."></div>
    </div>
    <div class="control-group">
      <h3>Lenses <button class="btn-add-lens" id="addLensBtn">+ Add Lens</button></h3>
      <div id="lensContainer"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="recalcBtn">Recalculate</button>
    <label class="toggle-label"><input type="checkbox" id="showGrid" checked> Grid</label>
    <label class="toggle-label"><input type="checkbox" id="showInvR" checked> Show 1/R(z)</label>
    <label class="toggle-label"><input type="checkbox" id="showPhase"> Show φ(z)</label>
    <label class="toggle-label"><input type="checkbox" id="showPoints"> Points</label>
    <label class="toggle-label"><input type="checkbox" id="showFwhm"> FWHM</label>
    <label class="toggle-label"><input type="checkbox" id="showWaistTrack"> Compare: waist-tracking (dashed)</label>
    <button class="btn" id="resetZoomBtn" style="display:none">Reset Zoom</button>
  </div>

  <div class="presets">
    <label>Presets:</label>
    <select id="presetSelect" title="Load a saved preset">
      <option value="">— Select —</option>
    </select>
    <button class="btn-preset" id="savePresetBtn">Save</button>
    <button class="btn-preset btn-preset-danger" id="deletePresetBtn">✕</button>
  </div>

  <div class="plot-wrap" id="plotWrap">
    <canvas id="plotCanvas"></canvas>
    <div class="zoom-rect" id="zoomRect"></div>
    <div class="v-cursor" id="vCursor"></div>
    <div class="cursor-info" id="cursorInfo"></div>
  </div>

  <div class="results" id="resultsPanel">
    <h3>Beam at Key Positions</h3>
    <table><thead id="resultsHead"><tr><th>z (mm)</th><th>Description</th><th>wₓ(z) (mm)</th><th>wᵧ(z) (mm)</th><th>R(z) (mm)</th><th>φ(z) (rad)</th></tr></thead><tbody id="resultsBody"></tbody></table>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// Complex number arithmetic (stored as [real, imag] arrays)
// ══════════════════════════════════════════════════════════════
const C = {
  re: (c) => c[0],
  im: (c) => c[1],
  conj: (c) => [c[0], -c[1]],
  add: (a, b) => [a[0] + b[0], a[1] + b[1]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  mul: (a, b) => [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]],
  div: (a, b) => { const d = b[0]*b[0] + b[1]*b[1]; return [(a[0]*b[0] + a[1]*b[1])/d, (a[1]*b[0] - a[0]*b[1])/d]; },
  scale: (c, s) => [c[0]*s, c[1]*s],
  abs: (c) => Math.sqrt(c[0]*c[0] + c[1]*c[1]),
  inv: (c) => { const d = c[0]*c[0] + c[1]*c[1]; return [c[0]/d, -c[1]/d]; }
};

// ══════════════════════════════════════════════════════════════
// ABCD ray-transfer matrices
//
// Free-space propagation over distance d:
//   M(d) = [[1, d], [0, 1]]
//
// Thin lens of focal length f:
//   M(f) = [[1, 0], [-1/f, 1]]
//
// Matrices compose by multiplication: M_total = M_N * ... * M_1
// (rightmost matrix is applied first).
// ══════════════════════════════════════════════════════════════
function matId() { return [[1,0],[0,1]]; }
function matFree(d) { return [[1,d],[0,1]]; }
function matLens(f) { return (!f || !isFinite(f)) ? [[1,0],[0,1]] : [[1,0],[-1/f,1]]; }
function matMul(A, B) {
  return [
    [A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]],
    [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]
  ];
}

// Apply an ABCD matrix to the complex beam parameter q.
// The q-parameter transforms as:
//   q' = (A*q + B) / (C*q + D)
function applyABCD(M, q) {
  const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1];
  return C.div(C.add(C.scale(q, a), [b,0]), C.add(C.scale(q, c), [d,0]));
}

// ══════════════════════════════════════════════════════════════
// Gaussian beam physics
//
// The complex beam parameter q = z + i*z_R encodes both the
// beam width w(z) and radius of curvature R(z) via:
//   1/q = 1/R - i*λ / (π * w²)
// ══════════════════════════════════════════════════════════════

// Compute the initial q-parameter from waist w₀ and R₀.
// R₀ = 0 is treated as ∞ (plane wavefront at z = 0).
function initQ(lambda, w0, R0, M2) {
  const invR = Math.abs(R0) < 1e-12 ? 0 : 1/R0;
  const invQ = [invR, -M2 * lambda / (Math.PI * w0 * w0)];
  return C.inv(invQ);
}

// Extract the beam width w and radius of curvature R from q.
function qToWR(q, lambda, M2) {
  const invQ = C.inv(q);
  const invR = invQ[0];
  const invW2 = -invQ[1] * Math.PI / (M2 * lambda);
  if (invW2 <= 0) return { w: Infinity, R: Math.abs(invR) < 1e-15 ? Infinity : 1/invR };
  const w = 1 / Math.sqrt(invW2);
  const R = Math.abs(invR) < 1e-15 ? Infinity : 1/invR;
  return { w, R };
}

// Reconstruct the q-parameter from w and R.
function reconstructQ(w, R, lambda, M2) {
  const invRVal = isFinite(R) && Math.abs(R) > 1e-15 ? 1 / R : 0;
  const invQ = [invRVal, -M2 * lambda / (Math.PI * w * w)];
  return C.inv(invQ);
}

// ══════════════════════════════════════════════════════════════
// Propagation engine
//
// Walks along the optical axis segment by segment.  At each lens
// position we record the beam parameters *before* and *after* the
// lens so the plot captures the discontinuity in R(z).  Within
// free-space segments the q-parameter is evaluated by building the
// ABCD matrix from the start of the segment, which avoids
// accumulating floating-point error across many steps.
// ══════════════════════════════════════════════════════════════
function propagate(lambda, w0, R0, lenses, totalLen, nSamples, M2) {
  const active = lenses.filter(l => l.active).sort((a, b) => a.pos - b.pos);
  const zMax = Math.max(totalLen, ...(active.length ? active.map(l => l.pos) : [0]));

  const zValues = [];
  const wValues = [];
  const RValues = [];
  const phaseValues = [];

  const q0 = initQ(lambda, w0, R0, M2);

  // No lenses — simple uniform free-space propagation.
  if (active.length === 0) {
    for (let i = 0; i < nSamples; i++) {
      const z = (i / (nSamples - 1)) * zMax;
      const M = matFree(z);
      const res = qToWR(applyABCD(M, q0), lambda, M2);
      zValues.push(z); wValues.push(res.w); RValues.push(res.R);
      const val = C.add([M[0][0], 0], C.scale(C.inv(q0), M[0][1]));
      phaseValues.push(-Math.atan2(val[1], val[0]));
    }
    return { zValues, wValues, RValues, phaseValues, zMax };
  }

  let q = q0;
  let prevZ = 0;
  let M_cum = matId();

  // Interior sample points are distributed proportionally among the
  // free-space segments (there are active.length + 1 of them).
  const nSegs = active.length + 1;
  const ptsPerSeg = Math.max(3, Math.floor(nSamples / nSegs));

  // Record the initial plane.
  { const r = qToWR(q, lambda, M2); zValues.push(0); wValues.push(r.w); RValues.push(r.R); phaseValues.push(0); }

  for (const lens of active) {
    const dz = lens.pos - prevZ;

    // Free-space samples between prevZ and the lens (exclusive of both
    // endpoints, which are recorded separately as the previous after-lens
    // and the upcoming before-lens point).
    if (dz > 0) {
      for (let j = 1; j < ptsPerSeg; j++) {
        const z = prevZ + (j / ptsPerSeg) * dz;
        const subDz = z - prevZ;
        const M_at = matMul(matFree(subDz), M_cum);
        const r = qToWR(applyABCD(matFree(subDz), q), lambda, M2);
        zValues.push(z); wValues.push(r.w); RValues.push(r.R);
        const val = C.add([M_at[0][0], 0], C.scale(C.inv(q0), M_at[0][1]));
        phaseValues.push(-Math.atan2(val[1], val[0]));
      }
      M_cum = matMul(matFree(dz), M_cum);
      q = applyABCD(matFree(dz), q);
    }

    // Beam parameters just before the lens.
    const b = qToWR(q, lambda, M2);
    zValues.push(lens.pos); wValues.push(b.w); RValues.push(b.R);
    { const val = C.add([M_cum[0][0], 0], C.scale(C.inv(q0), M_cum[0][1])); phaseValues.push(-Math.atan2(val[1], val[0])); }

    // Apply the thin-lens ABCD matrix.
    M_cum = matMul(matLens(lens.f), M_cum);
    q = applyABCD(matLens(lens.f), q);

    // Beam parameters just after the lens.
    const a = qToWR(q, lambda, M2);
    zValues.push(lens.pos); wValues.push(a.w); RValues.push(a.R);
    { const val = C.add([M_cum[0][0], 0], C.scale(C.inv(q0), M_cum[0][1])); phaseValues.push(-Math.atan2(val[1], val[0])); }

    prevZ = lens.pos;
  }

  // Final free-space segment from the last lens out to zMax.
  if (zMax > prevZ) {
    const remaining = zMax - prevZ;
    for (let j = 1; j < ptsPerSeg; j++) {
      const z = prevZ + (j / ptsPerSeg) * remaining;
      const subDz = z - prevZ;
      const M_at = matMul(matFree(subDz), M_cum);
      const r = qToWR(applyABCD(matFree(subDz), q), lambda, M2);
      zValues.push(z); wValues.push(r.w); RValues.push(r.R);
      const val = C.add([M_at[0][0], 0], C.scale(C.inv(q0), M_at[0][1]));
      phaseValues.push(-Math.atan2(val[1], val[0]));
    }
    M_cum = matMul(matFree(remaining), M_cum);
    const f = qToWR(applyABCD(matFree(remaining), q), lambda, M2);
    zValues.push(zMax); wValues.push(f.w); RValues.push(f.R);
    { const val = C.add([M_cum[0][0], 0], C.scale(C.inv(q0), M_cum[0][1])); phaseValues.push(-Math.atan2(val[1], val[0])); }
  }

  return { zValues, wValues, RValues, phaseValues, zMax };
}

// ══════════════════════════════════════════════════════════════
// Waist-tracking (standard formula) propagation
//
// Alternative propagation method that tracks the beam waist
// position (z₀) and Rayleigh range (z_R) explicitly instead of
// using ABCD matrices.  At each free-space sample point:
//
//   w(z) = w₀ · √(1 + ((z − z₀)/z_R)²)
//   R(z) = (z − z₀) · (1 + (z_R/(z − z₀))²)
//
// At a thin lens the radius transforms as 1/R_aft = 1/R_bef − 1/f
// while w is continuous, then a new waist is located via the
// q-parameter.  The method produces results identical to ABCD
// and serves as a cross-check.
// ══════════════════════════════════════════════════════════════
function propagateWaistTracking(zValues, w0, R0, lenses, lambda, M2) {
  M2 = M2 || 1;
  const active = lenses.filter(l => l.active).sort((a, b) => a.pos - b.pos);
  const n = zValues.length;
  const wVals = new Float64Array(n);
  const rVals = new Float64Array(n);

  // Determine the input waist parameters.
  let zWaist, wWaist, zR;
  if (Math.abs(R0) < 1e-12 || !isFinite(R0)) {
    zWaist = 0;
    wWaist = w0;
    zR = Math.PI * w0 * w0 / (M2 * lambda);
  } else {
    const q0 = reconstructQ(w0, R0, lambda, M2);
    zWaist = -q0[0];
    zR = q0[1];
    wWaist = Math.sqrt(M2 * lambda * zR / Math.PI);
  }

  // Build a fast look-up of lens positions.
  const lensAt = new Map();
  for (let i = 0; i < active.length; i++) lensAt.set(active[i].pos, active[i]);

  let lensIdx = 0;
  for (let i = 0; i < n; i++) {
    const z = zValues[i];

    // Detect "after lens" sample: same z as previous at a lens position.
    if (i > 0 && z === zValues[i - 1] && lensAt.has(z) && lensIdx < active.length) {
      const lens = active[lensIdx];
      if (lens.f) {
        const w_bef = wVals[i - 1];
        const R_bef = rVals[i - 1];
        const invR_bef = isFinite(R_bef) && Math.abs(R_bef) > 1e-15 ? 1 / R_bef : 0;
        const invR_aft = invR_bef - 1 / lens.f;
        const R_aft = Math.abs(invR_aft) < 1e-15 ? Infinity : 1 / invR_aft;
        const q_aft = reconstructQ(w_bef, R_aft, lambda, M2);
        zWaist = z - q_aft[0];
        zR = q_aft[1];
        wWaist = Math.sqrt(M2 * lambda * zR / Math.PI);
      }
      lensIdx++;
    }

    const d = z - zWaist;
    wVals[i] = wWaist * Math.sqrt(1 + (d / zR) ** 2);
    rVals[i] = Math.abs(d) < 1e-15 ? Infinity : d * (1 + (zR / d) ** 2);
  }

  return { wValues: wVals, RValues: rVals };
}

// ══════════════════════════════════════════════════════════════
// Canvas rendering
//
// The plot is split into two vertically stacked panels:
//   Top  (65 %) – beam width w(z) with filled envelope
//   Bottom (35 %) – radius of curvature R(z) (or 1/R(z))
//
// Axes auto-scale to the data range with 15 % headroom.
// Lens positions are marked with dashed vertical lines and a
// double-headed arrow symbol at the top of the w(z) panel.
// ══════════════════════════════════════════════════════════════
function drawPlot(canvas, dataX, lenses, opts, dataY, dataWT) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  const { zValues, wValues: wValuesX, RValues, phaseValues, zMax } = dataX;
  const wValuesY = dataY ? dataY.wValues : null;
  const isAsymmetric = wValuesY && (wValuesX.length === wValuesY.length);
  const active = lenses.filter(l => l.active).sort((a, b) => a.pos - b.pos);

  // Two-panel layout with margins for axis labels.
  // The right margin is wider when the R(z) or φ(z) panel is shown.
  const showBottom = opts.showR || opts.showPhase;
  const M = { top: 36, bottom: 36, left: 62, right: showBottom ? 62 : 18, gap: 4 };
  const pW = W - M.left - M.right;
  const pH1 = (H - M.top - M.bottom - M.gap) * 0.65;
  const pH2 = (H - M.top - M.bottom - M.gap) * 0.35;

  // Apply zoom: only the visible z-range is plotted.  Y-axes auto-scale
  // to the visible data so zooming in re-ranges the vertical scale.
  const wScale = opts.showFwhm ? Math.sqrt(2 * Math.log(2)) : 1;
  const zMin = opts.zoomRange ? opts.zoomRange.zMin : 0;
  const zMaxDisp = opts.zoomRange ? opts.zoomRange.zMax : zMax;
  const zSpan = Math.max(zMaxDisp - zMin, 1e-6);

  function idxFirst(arr, lo) { for (let i = 0; i < arr.length; i++) if (arr[i] >= lo) return i; return arr.length - 1; }
  function idxLast(arr, hi) { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] <= hi) return i; return 0; }
  let i0 = idxFirst(zValues, zMin);
  let i1 = idxLast(zValues, zMaxDisp);
  if (i1 < i0) { const t = i0; i0 = i1; i1 = t; }  // gap — include both bracketing points
  // Always include one neighbor on each side so the curve connects to the panel edges.
  if (i0 > 0) i0--;
  if (i1 < zValues.length - 1) i1++;

  // Auto-scale y-axes from visible data only (both x and y widths).
  const finiteW = [];
  const finiteR = [];
  for (let i = i0; i <= i1; i++) {
    if (isFinite(wValuesX[i]) && wValuesX[i] > 0) finiteW.push(wValuesX[i] * wScale);
    if (isAsymmetric && isFinite(wValuesY[i]) && wValuesY[i] > 0) finiteW.push(wValuesY[i] * wScale);
    if (isFinite(RValues[i])) finiteR.push(Math.abs(RValues[i]));
  }
  const maxW = finiteW.length ? Math.max(...finiteW) * 1.15 : 1;
  const minW = 0;
  const maxRVal = finiteR.length ? Math.max(...finiteR) : 1;
  const rLimit = Math.max(maxRVal * 1.2, 1);

  // Map data coordinates to canvas pixels.
  // Clamp x to just outside the panel bounds so line segments with endpoints
  // far outside the zoom range don't produce extreme pixel coordinates that
  // cause canvas rendering engines to clip or fail.
  const xClampMin = M.left - 1;
  const xClampMax = M.left + pW + 1;
  const toX = (z) => Math.max(xClampMin, Math.min(xClampMax, M.left + ((z - zMin) / zSpan) * pW));
  const toY1 = (w) => M.top + pH1 * (1 - w / maxW);

  // Clear
  ctx.clearRect(0, 0, W, H);

  // --- Plot 1: w(z) ---
  ctx.save();
  ctx.beginPath();
  ctx.rect(M.left, M.top, pW, pH1);
  ctx.clip();

  if (opts.showGrid) drawGrid(ctx, M.left, M.top, pW, pH1, zSpan, maxW, 5, 5);

  // Filled envelope from 0 to wₓ(z).
  ctx.beginPath();
  ctx.moveTo(toX(zValues[i0]), toY1(0));
  for (let i = i0; i <= i1; i++) {
    const y = toY1(Math.max(wValuesX[i] * wScale, 0));
    ctx.lineTo(toX(zValues[i]), y);
  }
  for (let i = i1; i >= i0; i--) {
    const y = toY1(0);
    ctx.lineTo(toX(zValues[i]), y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(59,130,246,0.06)';
  ctx.fill();

  // Upper boundary of the beam — wₓ(z)
  ctx.beginPath();
  let wFirst = true;
  for (let i = i0; i <= i1; i++) {
    const x = toX(zValues[i]);
    const y = toY1(Math.max(wValuesX[i] * wScale, 0));
    if (wFirst) { ctx.moveTo(x, y); wFirst = false; } else { ctx.lineTo(x, y); }
  }
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Optional point markers on wₓ(z).
  if (opts.showPoints) {
    ctx.fillStyle = '#2563eb';
    for (let i = i0; i <= i1; i++) {
      const y = toY1(Math.max(wValuesX[i] * wScale, 0));
      ctx.beginPath();
      ctx.arc(toX(zValues[i]), y, 2.5, 0, 2 * Math.PI);
      ctx.fill();
    }
  }

  // Waist-tracking comparison (dashed) on the w panel.
  if (dataWT) {
    const { wValues: wWT, RValues: rWT } = dataWT;
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let firstWT = true;
    for (let i = i0; i <= i1; i++) {
      if (wWT[i] === undefined) continue;
      const x = toX(zValues[i]);
      const y = toY1(Math.max(wWT[i] * wScale, 0));
      if (firstWT) { ctx.moveTo(x, y); firstWT = false; } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Second beam width curve wᵧ(z) for asymmetric beams.
  if (isAsymmetric) {
    ctx.beginPath();
    let wFirstY = true;
    for (let i = i0; i <= i1; i++) {
      const x = toX(zValues[i]);
      const y = toY1(Math.max(wValuesY[i] * wScale, 0));
      if (wFirstY) { ctx.moveTo(x, y); wFirstY = false; } else { ctx.lineTo(x, y); }
    }
    ctx.strokeStyle = '#d946ef';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (opts.showPoints) {
      ctx.fillStyle = '#d946ef';
      for (let i = i0; i <= i1; i++) {
        const y = toY1(Math.max(wValuesY[i] * wScale, 0));
        ctx.beginPath();
        ctx.arc(toX(zValues[i]), y, 2.5, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
    // Waist-tracking dashed comparison on the wᵧ curve.
    if (dataWT) {
      const { wValues: wWT } = dataWT;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#d946ef';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let firstWTy = true;
      for (let i = i0; i <= i1; i++) {
        if (wWT[i] === undefined) continue;
        const x = toX(zValues[i]);
        const y = toY1(Math.max(wWT[i] * wScale, 0));
        if (firstWTy) { ctx.moveTo(x, y); firstWTy = false; } else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Lens markers on the w(z) panel: a dashed vertical line at the lens
  // position, topped with a double-headed arrow as the conventional
  // thin-lens symbol.  Only drawn when the lens is inside the visible range.
  for (const lens of active) {
    if (lens.pos < zMin || lens.pos > zMaxDisp) continue;
    const x = toX(lens.pos);
    ctx.beginPath();
    ctx.moveTo(x, M.top);
    ctx.lineTo(x, M.top + pH1);
    ctx.strokeStyle = '#059669';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrow head with two barbs
    const ly = M.top + 12;
    ctx.beginPath();
    ctx.moveTo(x - 8, ly);
    ctx.lineTo(x + 8, ly);
    ctx.strokeStyle = '#059669';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 5, ly - 4);
    ctx.lineTo(x - 8, ly);
    ctx.lineTo(x - 5, ly + 4);
    ctx.strokeStyle = '#059669';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 5, ly - 4);
    ctx.lineTo(x + 8, ly);
    ctx.lineTo(x + 5, ly + 4);
    ctx.strokeStyle = '#059669';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Waist markers: an 'x' at every detected beam waist on the w panel.
  if (opts.waistMarkers) {
    const { x: xWaists, y: yWaists } = opts.waistMarkers;
    const drawWaistX = (z, w, color) => {
      if (z < zMin || z > zMaxDisp) return;
      const x = toX(z);
      const y = toY1(Math.max(w, 0));
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5);
      ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5);
      ctx.stroke();
    };
    for (const wx of xWaists) drawWaistX(wx.z, wx.w * wScale, '#2563eb');
    for (const wy of yWaists) drawWaistX(wy.z, wy.w * wScale, '#d946ef');
  }

  ctx.restore();

  // Axis labels (plot 1)
  ctx.fillStyle = '#6b7280';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(opts.showFwhm ? 'Beam width FWHM [mm]' : 'Beam width w(z) [mm]', M.left + pW / 2, M.top - 6);
  // Y-axis label
  ctx.save();
  ctx.translate(14, M.top + pH1 / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText(opts.showFwhm ? 'FWHM [mm]' : 'w(z) [mm]', 0, 0);
  ctx.restore();
  // Y-axis tick labels
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = '10px sans-serif';
  const nYTicks1 = 5;
  for (let i = 0; i <= nYTicks1; i++) {
    const val = (i / nYTicks1) * maxW;
    const y = toY1(val);
    ctx.fillText(val.toFixed(2), M.left - 6, y);
  }

  // --- Bottom panel: φ(z), R(z), or 1/R(z) ---
  // When showPhase is checked the panel plots the accumulated Guoy phase
  // φ(z) = -Arg(A(z) + B(z)/q₀).  When showInvR is checked it plots
  // 1/R(z) instead of R(z), which can be more informative near beam
  // waists (where R → ∞, 1/R → 0).
  if (opts.showPhase) {
    // Auto-scale the phase panel to the visible z-range.
    const finitePhase = [];
    for (let i = i0; i <= i1; i++) {
      if (isFinite(phaseValues[i])) finitePhase.push(phaseValues[i]);
    }
    const minP = finitePhase.length ? Math.min(...finitePhase) : 0;
    const maxP = finitePhase.length ? Math.max(...finitePhase) : 1;
    const pRange = Math.max(maxP - minP, 0.01);
    const pPad = pRange * 0.15;
    const pLow = minP - pPad;
    const pHigh = maxP + pPad;
    const pSpan = pHigh - pLow;
    const pCenter = (pLow + pHigh) / 2;

    const toY = (v) => M.top + pH1 + M.gap + pH2 * (1 - (v - pLow) / pSpan);

    ctx.save();
    ctx.beginPath();
    ctx.rect(M.left, M.top + pH1 + M.gap, pW, pH2);
    ctx.clip();

    if (opts.showGrid) drawGrid(ctx, M.left, M.top + pH1 + M.gap, pW, pH2, zSpan, pSpan, 5, 5, pCenter);

    ctx.beginPath();
    let started = false;
    for (let i = i0; i <= i1; i++) {
      const v = phaseValues[i];
      if (!isFinite(v)) { started = false; continue; }
      const x = toX(zValues[i]);
      const y = toY(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.strokeStyle = '#0891b2';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    if (opts.showPoints) {
      ctx.fillStyle = '#0891b2';
      for (let i = i0; i <= i1; i++) {
        const v = phaseValues[i];
        if (!isFinite(v)) continue;
        ctx.beginPath();
        ctx.arc(toX(zValues[i]), toY(v), 3, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    // Zero-phase reference axis line (clipped to panel bounds).
    const y0 = toY(0);
    ctx.beginPath();
    ctx.moveTo(M.left, y0);
    ctx.lineTo(M.left + pW, y0);
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);

    for (const lens of active) {
      if (lens.pos < zMin || lens.pos > zMaxDisp) continue;
      const x = toX(lens.pos);
      ctx.beginPath();
      ctx.moveTo(x, M.top + pH1 + M.gap);
      ctx.lineTo(x, M.top + pH1 + M.gap + pH2);
      ctx.strokeStyle = '#059669';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();

    ctx.fillStyle = '#6b7280';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Accumulated Guoy phase φ [rad]', M.left + pW / 2, M.top + pH1 + M.gap - 4);
    ctx.save();
    ctx.translate(14, M.top + pH1 + M.gap + pH2 / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillText('φ [rad]', 0, 0);
    ctx.restore();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '10px sans-serif';
    const nYTicks2 = 5;
    for (let i = 0; i <= nYTicks2; i++) {
      const val = pLow + (i / nYTicks2) * pSpan;
      const y = toY(val);
      ctx.fillText(val.toFixed(4), M.left - 6, y);
    }
  } else if (opts.showR) {
    const useInvR = opts.showInvR;

    // Compute the y-axis values from the raw R data.
    // At a waist R = ∞ → 1/R = 0; near a focus R ≈ 0 → 1/R is clipped.
    const plotY = new Float64Array(zValues.length);
    for (let i = 0; i < zValues.length; i++) {
      const R = RValues[i];
      plotY[i] = useInvR ? (isFinite(R) && Math.abs(R) > 1e-15 ? 1 / R : 0) : R;
    }
    const plotYy = isAsymmetric ? new Float64Array(zValues.length) : null;
    if (plotYy) {
      for (let i = 0; i < zValues.length; i++) {
        const R = dataY.RValues[i];
        plotYy[i] = useInvR ? (isFinite(R) && Math.abs(R) > 1e-15 ? 1 / R : 0) : R;
      }
    }

    // Auto-scale the bottom panel to the visible z-range only,
    // with a fallback minimum span so the axis doesn't collapse.
    const finiteVals = [];
    for (let i = i0; i <= i1; i++) {
      if (isFinite(plotY[i])) finiteVals.push(Math.abs(plotY[i]));
      if (plotYy && isFinite(plotYy[i])) finiteVals.push(Math.abs(plotYy[i]));
    }
    const maxV = finiteVals.length ? Math.max(...finiteVals) * 1.2 : (useInvR ? 0.01 : 1);
    const yLimit = Math.max(maxV, useInvR ? 0.001 : 1);

    const yLabel = useInvR ? '1/R(z) [1/mm]' : 'Radius of curvature R(z) [mm]';
    const yShort = useInvR ? '1/R [1/mm]' : 'R [mm]';
    const lineColor = useInvR ? '#7c3aed' : '#dc2626';
    const toY = (v) => M.top + pH1 + M.gap + pH2 * (0.5 - v / (2 * yLimit));

    ctx.save();
    ctx.beginPath();
    ctx.rect(M.left, M.top + pH1 + M.gap, pW, pH2);
    ctx.clip();

    if (opts.showGrid) drawGrid(ctx, M.left, M.top + pH1 + M.gap, pW, pH2, zSpan, 2 * yLimit, 5, 5, 0);

    // Draw the curve over the visible z-range only.
    ctx.beginPath();
    let started = false;
    for (let i = i0; i <= i1; i++) {
      const v = plotY[i];
      if (!isFinite(v)) { started = false; continue; }
      const clamped = Math.max(-yLimit, Math.min(yLimit, v));
      const x = toX(zValues[i]);
      const y = toY(clamped);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Waist-tracking dashed comparison on the R/1/R panel.
    if (dataWT) {
      const { RValues: rWT } = dataWT;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      let startedWT = false;
      for (let i = i0; i <= i1; i++) {
        const R = rWT[i];
        if (R === undefined) continue;
        const v = useInvR ? (isFinite(R) && Math.abs(R) > 1e-15 ? 1 / R : 0) : R;
        if (!isFinite(v)) { startedWT = false; continue; }
        const clamped = Math.max(-yLimit, Math.min(yLimit, v));
        const x = toX(zValues[i]);
        const y = toY(clamped);
        if (!startedWT) { ctx.moveTo(x, y); startedWT = true; }
        else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // y-direction R/1/R curve for asymmetric beams.
    if (plotYy) {
      ctx.beginPath();
      let startedY = false;
      for (let i = i0; i <= i1; i++) {
        const v = plotYy[i];
        if (!isFinite(v)) { startedY = false; continue; }
        const clamped = Math.max(-yLimit, Math.min(yLimit, v));
        const x = toX(zValues[i]);
        const y = toY(clamped);
        if (!startedY) { ctx.moveTo(x, y); startedY = true; }
        else { ctx.lineTo(x, y); }
      }
      ctx.strokeStyle = '#d946ef';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      if (opts.showPoints) {
        ctx.fillStyle = '#d946ef';
        for (let i = i0; i <= i1; i++) {
          const v = plotYy[i];
          if (!isFinite(v)) continue;
          const clamped = Math.max(-yLimit, Math.min(yLimit, v));
          ctx.beginPath();
          ctx.arc(toX(zValues[i]), toY(clamped), 3, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    // Optional point markers at every visible data sample.
    if (opts.showPoints) {
      ctx.fillStyle = lineColor;
      for (let i = i0; i <= i1; i++) {
        const v = plotY[i];
        if (!isFinite(v)) continue;
        const clamped = Math.max(-yLimit, Math.min(yLimit, v));
        ctx.beginPath();
        ctx.arc(toX(zValues[i]), toY(clamped), 3, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    // Dashed horizontal line at y = 0 as a visual reference.
    const y0 = toY(0);
    ctx.beginPath();
    ctx.moveTo(M.left, y0);
    ctx.lineTo(M.left + pW, y0);
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);

    for (const lens of active) {
      if (lens.pos < zMin || lens.pos > zMaxDisp) continue;
      const x = toX(lens.pos);
      ctx.beginPath();
      ctx.moveTo(x, M.top + pH1 + M.gap);
      ctx.lineTo(x, M.top + pH1 + M.gap + pH2);
      ctx.strokeStyle = '#059669';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Waist markers on the R / 1/R panel.
    if (opts.waistMarkers) {
      const { x: xWaists, y: yWaists } = opts.waistMarkers;
      const drawWaistX_R = (z, color) => {
        if (z < zMin || z > zMaxDisp) return;
        const x = toX(z);
        const y = useInvR ? toY(0) : toY(yLimit);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5);
        ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5);
        ctx.stroke();
      };
      for (const wx of xWaists) drawWaistX_R(wx.z, '#2563eb');
      for (const wy of yWaists) drawWaistX_R(wy.z, '#d946ef');
    }

    ctx.restore();

    ctx.fillStyle = '#6b7280';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(yLabel, M.left + pW / 2, M.top + pH1 + M.gap - 4);
    ctx.save();
    ctx.translate(14, M.top + pH1 + M.gap + pH2 / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillText(yShort, 0, 0);
    ctx.restore();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '10px sans-serif';
    const nYTicks2 = 5;
    for (let i = 0; i <= nYTicks2; i++) {
      const val = -yLimit + (i / nYTicks2) * 2 * yLimit;
      const y = toY(val);
      ctx.fillText(val.toFixed(useInvR ? 4 : 0), M.left - 6, y);
    }
  }

  // X-axis label
  ctx.fillStyle = '#6b7280';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('Optical axis z [mm]', M.left + pW / 2, H - M.bottom + 6);

  // X-axis ticks
  ctx.textBaseline = 'top';
  ctx.font = '10px sans-serif';
  const nXTicks = 8;
  for (let i = 0; i <= nXTicks; i++) {
    const val = zMin + (i / nXTicks) * zSpan;
    const x = toX(val);
    ctx.fillText(val.toFixed(1), x, H - M.bottom + 20);
  }

  // Legend
  const showWT = !!dataWT;
  const legEntries = 1 + (isAsymmetric ? 1 : 0) + (showBottom ? (opts.showPhase ? 1 : (isAsymmetric ? 2 : 1)) : 0) + (showWT ? 1 : 0);
  const legH = 24 * legEntries;
  const lx = M.left + pW - 120, ly = M.top + 8;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(lx - 8, ly - 4, 128, legH);
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.strokeRect(lx - 8, ly - 4, 128, legH);

  let lyOff = ly + 2;
  ctx.beginPath();
  ctx.moveTo(lx, lyOff + 6);
  ctx.lineTo(lx + 20, lyOff + 6);
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#1f2937';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(opts.showFwhm ? (isAsymmetric ? 'FWHMₓ(z)' : 'FWHM(z)') : (isAsymmetric ? 'wₓ(z)' : 'w(z)'), lx + 26, lyOff + 6);

  if (isAsymmetric) {
    lyOff += 20;
    ctx.beginPath();
    ctx.moveTo(lx, lyOff + 6);
    ctx.lineTo(lx + 20, lyOff + 6);
    ctx.strokeStyle = '#d946ef';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#1f2937';
    ctx.fillText(opts.showFwhm ? 'FWHMᵧ(z)' : 'wᵧ(z)', lx + 26, lyOff + 6);
  }

  if (opts.showPhase) {
    lyOff += 20;
    ctx.beginPath();
    ctx.moveTo(lx, lyOff + 6);
    ctx.lineTo(lx + 20, lyOff + 6);
    ctx.strokeStyle = '#0891b2';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = '#1f2937';
    ctx.fillText('φ(z)', lx + 26, lyOff + 6);
  } else if (opts.showR) {
    lyOff += 20;
    ctx.beginPath();
    ctx.moveTo(lx, lyOff + 6);
    ctx.lineTo(lx + 20, lyOff + 6);
    ctx.strokeStyle = opts.showInvR ? '#7c3aed' : '#dc2626';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = '#1f2937';
    ctx.fillText(opts.showInvR ? '1/Rₓ(z)' : 'Rₓ(z)', lx + 26, lyOff + 6);
    if (isAsymmetric) {
      lyOff += 20;
      ctx.beginPath();
      ctx.moveTo(lx, lyOff + 6);
      ctx.lineTo(lx + 20, lyOff + 6);
      ctx.strokeStyle = '#d946ef';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.fillStyle = '#1f2937';
      ctx.fillText(opts.showInvR ? '1/Rᵧ(z)' : 'Rᵧ(z)', lx + 26, lyOff + 6);
    }
  }

  if (showWT) {
    lyOff += 20;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(lx, lyOff + 6);
    ctx.lineTo(lx + 20, lyOff + 6);
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6b7280';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('WT (dashed)', lx + 26, lyOff + 6);
  }
}

// Draw a light Cartesian grid inside the given rectangular region.
// nx, ny control the number of divisions along each axis.
// yCenter defines the mid-point of the y-range (default 0).
function drawGrid(ctx, ox, oy, w, h, xMax, yRange, nx, ny, yCenter) {
  ctx.save();
  ctx.strokeStyle = '#d0d5dd';
  ctx.lineWidth = 1;
  yCenter = yCenter || 0;
  for (let i = 0; i <= nx; i++) {
    const x = ox + (i / nx) * w;
    ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + h); ctx.stroke();
  }
  for (let i = 0; i <= ny; i++) {
    const val = yCenter - yRange / 2 + (i / ny) * yRange;
    const y = oy + h * (1 - (val - (yCenter - yRange / 2)) / yRange);
    ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + w, y); ctx.stroke();
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════
// Mouse tracking overlay & drag-to-zoom
//
// Hovering shows a vertical cursor and tooltip with exact values.
// Dragging left-to-right (or right-to-left) on the plot selects a
// z-range to zoom into.  A semi-transparent rectangle is drawn
// during the drag for visual feedback.
// ══════════════════════════════════════════════════════════════
function setupMouseTracking(canvas, dataX, lenses, opts, dataY, dataWT) {
  const wrap = document.getElementById('plotWrap');
  const vCursor = document.getElementById('vCursor');
  const info = document.getElementById('cursorInfo');
  const zoomRect = document.getElementById('zoomRect');

  let dragStart = null;

  // Convert a mouse clientX to canvas-local mx and data-space z,
  // accounting for the current zoom level.
  function posFrom(clientX) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left;
    const M = { left: 62, right: (opts.showR || opts.showPhase) ? 62 : 18 };
    const pW = rect.width - M.left - M.right;
    const zEffMin = opts.zoomRange ? opts.zoomRange.zMin : 0;
    const zEffMax = opts.zoomRange ? opts.zoomRange.zMax : dataX.zMax;
    const z = mx < M.left ? zEffMin
            : mx > M.left + pW ? zEffMax
            : zEffMin + ((mx - M.left) / pW) * (zEffMax - zEffMin);
    return { mx, z, M, pW, rect };
  }

  canvas.addEventListener('mousedown', (e) => {
    if (e.shiftKey) {
      const curMin = opts.zoomRange ? opts.zoomRange.zMin : 0;
      const curMax = opts.zoomRange ? opts.zoomRange.zMax : dataX.zMax;
      const expand = (curMax - curMin) * 0.2;
      zoomRange = { zMin: Math.max(0, curMin - expand), zMax: Math.min(dataX.zMax, curMax + expand) };
      update();
      return;
    }
    const p = posFrom(e.clientX);
    dragStart = { clientX: e.clientX, mx: p.mx, z: p.z };
  });

  canvas.addEventListener('mousemove', (e) => {
    const p = posFrom(e.clientX);

    if (dragStart) {
      // Drag is active — show the zoom selection rectangle.
      const wrapRect = wrap.getBoundingClientRect();
      const sx = dragStart.clientX - wrapRect.left;
      const cx = e.clientX - wrapRect.left;
      zoomRect.style.display = 'block';
      zoomRect.style.left = Math.min(sx, cx) + 'px';
      zoomRect.style.width = Math.abs(cx - sx) + 'px';
      zoomRect.style.top = '0px';
      zoomRect.style.height = wrapRect.height + 'px';
      return;
    }

    // Not dragging — show the cursor tooltip.
    if (p.mx < p.M.left || p.mx > p.M.left + p.pW || !dataX.zValues) {
      vCursor.style.display = 'none';
      info.style.display = 'none';
      return;
    }

    let idx = 0, minDist = Infinity;
    for (let i = 0; i < dataX.zValues.length; i++) {
      const d = Math.abs(dataX.zValues[i] - p.z);
      if (d < minDist) { minDist = d; idx = i; }
    }

    const zi = dataX.zValues[idx];
    const wScaleT = opts.showFwhm ? Math.sqrt(2 * Math.log(2)) : 1;
    const wLabel = opts.showFwhm ? 'FWHM' : 'w';
    const wix = dataX.wValues[idx] * wScaleT;
    const Riy = dataY ? dataY.RValues[idx] : dataX.RValues[idx];
    const wiy = dataY ? dataY.wValues[idx] * wScaleT : wix;

    vCursor.style.display = 'block';
    vCursor.style.left = (p.mx + p.rect.left - wrap.getBoundingClientRect().left) + 'px';
    vCursor.style.height = p.rect.height + 'px';

    info.style.display = 'block';
    const rStr = (v) => isFinite(v) ? (Math.abs(v) > 1e8 ? '∞' : v.toExponential(4)) : '∞';
    const invRStr = (v) => isFinite(v) ? (Math.abs(v) > 1e-15 ? (1/v).toExponential(4) : '0') : '0';
    const RRx = dataX.RValues[idx];
    const wLine = `${wLabel}ₓ = ${wix.toFixed(4)} mm, ${wLabel}ᵧ = ${wiy.toFixed(4)} mm`;
    const rLine = `Rₓ = ${rStr(RRx)} mm, 1/Rₓ = ${invRStr(RRx)} mm⁻¹<br>Rᵧ = ${rStr(Riy)} mm, 1/Rᵧ = ${invRStr(Riy)} mm⁻¹`;
    let wtLine = '';
    if (dataWT) {
      const wWT = dataWT.wValues[idx] * wScaleT;
      const RWT = dataWT.RValues[idx];
      if (wWT !== undefined && RWT !== undefined) {
        const rWTStr = isFinite(RWT) ? (Math.abs(RWT) > 1e8 ? '∞' : RWT.toExponential(4)) : '∞';
        wtLine = `<span style="color:#6b7280">WT: ${wLabel} = ${wWT.toFixed(4)} mm, R = ${rWTStr} mm</span><br>`;
      }
    }
    if (opts.showPhase) {
      const phi = dataX.phaseValues[idx];
      info.innerHTML = `z = ${zi.toFixed(3)} mm<br>${wLine}<br>${rLine}<br>${wtLine}φ = ${isFinite(phi) ? phi.toFixed(6) : '0'} rad`;
    } else {
      info.innerHTML = `z = ${zi.toFixed(3)} mm<br>${wLine}<br>${rLine}<br>${wtLine}`;
    }

    let ix = p.mx + 14;
    let iy = e.clientY - p.rect.top - 20;
    if (ix + 130 > p.rect.width) ix = p.mx - 140;
    if (iy < 4) iy = 4;
    if (iy + 50 > p.rect.height) iy = p.rect.height - 54;
    info.style.left = ix + 'px';
    info.style.top = iy + 'px';
  });

  canvas.addEventListener('mouseup', (e) => {
    if (!dragStart) return;
    const p = posFrom(e.clientX);
    const zEffMin = opts.zoomRange ? opts.zoomRange.zMin : 0;
    const zEffMax = opts.zoomRange ? opts.zoomRange.zMax : dataX.zMax;
    const dz = Math.abs(p.z - dragStart.z);
    if (dz > (zEffMax - zEffMin) * 0.02) {
      zoomRange = { zMin: Math.min(dragStart.z, p.z), zMax: Math.max(dragStart.z, p.z) };
      update();
    }
    dragStart = null;
    zoomRect.style.display = 'none';
  });

  canvas.addEventListener('dblclick', () => {
    zoomRange = null;
    update();
  });

  canvas.addEventListener('mouseleave', () => {
    dragStart = null;
    zoomRect.style.display = 'none';
    vCursor.style.display = 'none';
    info.style.display = 'none';
  });
}

// ══════════════════════════════════════════════════════════════
// Results table
//
// Shows w(z) and R(z) at z = 0, at every lens (both before and
// after), and at z = zMax.  Because the propagation now records
// two values at each lens position, we find the first occurrence
// (before the lens) and the last occurrence (after the lens) for
// each active lens.
// ══════════════════════════════════════════════════════════════
// Find exact waist positions by interpolating the q-parameter between
// adjacent samples in free-space segments.  A waist occurs where
// Re(1/q) = 0, i.e. where R → ∞.  For free-space propagation between
// samples at z[i] and z[i+1] with q-parameter q at z[i], the exact
// waist is at z_waist = z[i] - Re(q).
function findExactWaists(zValues, wValues, RValues, lambda, M2) {
  const waists = [];
  for (let i = 0; i < zValues.length - 1; i++) {
    if (zValues[i + 1] === zValues[i]) continue; // skip lens planes
    const invRi = isFinite(RValues[i]) && Math.abs(RValues[i]) > 1e-15 ? 1 / RValues[i] : 0;
    const invRn = isFinite(RValues[i + 1]) && Math.abs(RValues[i + 1]) > 1e-15 ? 1 / RValues[i + 1] : 0;
    if (invRi * invRn >= 0) continue; // no sign change → no waist between these samples
    const q_i = reconstructQ(wValues[i], RValues[i], lambda, M2);
    const zWaist = zValues[i] - q_i[0];
    if (zWaist < zValues[i] || zWaist > zValues[i + 1]) continue;
    const qWaist = C.add(q_i, [zWaist - zValues[i], 0]);
    const wWaist = qToWR(qWaist, lambda, M2).w;
    waists.push({ z: zWaist, w: wWaist });
  }
  return waists;
}

function updateResults(dataX, lenses, totalLen, dataY, lambda, M2, showFwhm) {
  const tbody = document.getElementById('resultsBody');
  const thead = document.getElementById('resultsHead');
  const active = lenses.filter(l => l.active).sort((a, b) => a.pos - b.pos);
  const { zValues, wValues: wValuesX, RValues, phaseValues } = dataX;
  const wValuesY = dataY ? dataY.wValues : null;
  const isAsymmetric = wValuesY && (wValuesX.length === wValuesY.length);

  // Update table header dynamically.
  const wLabel = showFwhm ? 'FWHM' : 'w';
  thead.innerHTML = '<tr><th>z (mm)</th><th>Description</th><th>' + wLabel + 'ₓ(z) (mm)</th>'
    + (isAsymmetric ? '<th>' + wLabel + 'ᵧ(z) (mm)</th>' : '')
    + '<th>R(z) (mm)</th><th>φ(z) (rad)</th></tr>';

  const rows = [];

  // Exact waist finder using q-parameter interpolation.
  // We detect waists in both x and y propagations when asymmetric.
  const xWaists = findExactWaists(zValues, wValuesX, RValues, lambda, M2);
  const yRValues = dataY ? dataY.RValues : null;
  const yWaists = isAsymmetric ? findExactWaists(zValues, wValuesY, yRValues, lambda, M2) : [];
  const wScaleR = showFwhm ? Math.sqrt(2 * Math.log(2)) : 1;
  const waistZs = [...new Set([...xWaists.map(w => w.z.toFixed(8)), ...yWaists.map(w => w.z.toFixed(8))])].map(Number).sort((a, b) => a - b);
  for (const z of waistZs) {
    const xw = xWaists.find(w => Math.abs(w.z - z) < 1e-6);
    const yw = yWaists.find(w => Math.abs(w.z - z) < 1e-6);
    rows.push({ z, desc: 'Beam waist', wx: xw ? xw.w : null, wy: yw ? yw.w : null, R: Infinity, phi: null });
  }

  // Helper to look up a value at a given z index.
  const at = (i, wArr) => wArr ? wArr[i] : null;

  // Input plane (z = 0 is always the very first sample).
  rows.push({ z: 0, desc: 'Input plane', wx: wValuesX[0], wy: at(0, wValuesY), R: RValues[0], phi: phaseValues[0] });

  // For each lens, locate the first and last occurrence of its
  // position in zValues.  The first is the value *before* the lens,
  // the last is the value *after* the lens.
  for (const lens of active) {
    let iFirst = -1, iLast = -1;
    for (let i = 0; i < zValues.length; i++) {
      if (Math.abs(zValues[i] - lens.pos) < 1e-9) {
        if (iFirst === -1) iFirst = i;
        iLast = i;
      }
    }
    if (iFirst !== -1) {
      const fmtF = (v) => v ? v + '' : '∞';
      const fDesc = (lens.fx !== lens.fy) ? `fₓ=${fmtF(lens.fx)}, fᵧ=${fmtF(lens.fy)} mm` : `f=${fmtF(lens.fx)} mm`;
      rows.push({ z: lens.pos, desc: `Before lens (${fDesc})`, wx: wValuesX[iFirst], wy: at(iFirst, wValuesY), R: RValues[iFirst], phi: phaseValues[iFirst] });
      if (iLast > iFirst) {
        rows.push({ z: lens.pos, desc: `After lens (${fDesc})`, wx: wValuesX[iLast], wy: at(iLast, wValuesY), R: RValues[iLast], phi: phaseValues[iLast] });
      }
    }
  }

  // Output plane (last sampled point).
  const last = zValues.length - 1;
  rows.push({ z: zValues[last], desc: 'Output plane', wx: wValuesX[last], wy: at(last, wValuesY), R: RValues[last], phi: phaseValues[last] });

  // Sort by z; stable sort preserves before/after ordering for same-z rows.
  rows.sort((a, b) => a.z - b.z);

  tbody.innerHTML = rows.map(r => {
    const rStr = r.desc === 'Beam waist' ? '∞' : (isFinite(r.R) ? (Math.abs(r.R) > 1e8 ? '∞' : r.R.toFixed(1)) : '∞');
    const phiStr = r.phi !== null ? r.phi.toFixed(6) : '-';
    const wXStr = r.wx !== null ? (r.wx * wScaleR).toFixed(4) : '-';
    const wYStr = isAsymmetric && r.wy !== null ? (r.wy * wScaleR).toFixed(4) : (isAsymmetric ? '-' : '');
    return `<tr><td>${r.z.toFixed(4)}</td><td>${r.desc}</td><td>${wXStr}</td>`
      + (isAsymmetric ? `<td>${wYStr}</td>` : '')
      + `<td>${rStr}</td><td>${phiStr}</td></tr>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// Dynamic lens management
//
// The user can add up to 10 lenses.  Each lens gets a row of
// controls (position, focal length, on/off toggle).  A remove
// button (×) appears when more than one lens exists.
//
// lensData is the in-memory source of truth.  syncLensDataFromDOM()
// saves the current DOM values back to lensData before structural
// changes (add/remove).  readLenses() is used during update() to
// get the current state.  renderLenses() rebuilds the DOM from
// lensData.
// ══════════════════════════════════════════════════════════════
let lensData = [{ pos: 100, fx: 25, fy: 25, active: true }, { pos: 200, fx: 75, fy: 75, active: true }];
let zoomRange = null;
const FWHM_FACTOR = Math.sqrt(2 * Math.log(2));

function syncLensDataFromDOM() {
  const rows = document.querySelectorAll('#lensContainer .lens-row');
  if (rows.length) {
    lensData = Array.from(rows).map(row => ({
      pos: parseFloat(row.querySelector('.lens-pos').value),
      fx: parseFloat(row.querySelector('.lens-fx').value),
      fy: parseFloat(row.querySelector('.lens-fy').value),
      active: row.querySelector('.lens-active').checked
    }));
  }
}

function readLenses() {
  const rows = document.querySelectorAll('#lensContainer .lens-row');
  return Array.from(rows).map(row => ({
    pos: parseFloat(row.querySelector('.lens-pos').value),
    fx: parseFloat(row.querySelector('.lens-fx').value),
    fy: parseFloat(row.querySelector('.lens-fy').value),
    active: row.querySelector('.lens-active').checked
  }));
}

function renderLenses() {
  const container = document.getElementById('lensContainer');
  container.innerHTML = '';
  lensData.forEach((lens, i) => {
    const row = document.createElement('div');
    row.className = 'lens-row';
    const canRemove = lensData.length > 1;
    row.innerHTML = '<span class="lens-label">Lens ' + (i + 1) + '</span>'
      + '<div class="field"><label>Pos (mm)</label><input type="number" class="lens-pos" value="' + lens.pos + '" step="5" title="Distance from z = 0 to the lens"></div>'
      + '<div class="field"><label>fₓ (mm)</label><input type="number" class="lens-fx" value="' + lens.fx + '" step="5" title="0 = ∞"></div>'
      + '<div class="field"><label>fᵧ (mm)</label><input type="number" class="lens-fy" value="' + lens.fy + '" step="5" title="0 = ∞"></div>'
      + '<div class="field"><label><input type="checkbox" class="lens-active"' + (lens.active ? ' checked' : '') + '> On</label></div>'
      + (canRemove ? '<button class="lens-remove" data-idx="' + i + '">×</button>' : '');
    container.appendChild(row);
  });
  container.querySelectorAll('.lens-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      lensData.splice(parseInt(btn.dataset.idx), 1);
      renderLenses();
      update();
    });
  });
}

// ══════════════════════════════════════════════════════════════
// Preset save / load
//
// Presets are stored in localStorage under a single key as a
// JSON array of { name, beam, lenses } objects.
// ══════════════════════════════════════════════════════════════
const PRESET_KEY = 'abcdPresets';

function loadPresets() {
  try { return JSON.parse(localStorage.getItem(PRESET_KEY)) || []; } catch { return []; }
}

function savePresets(presets) {
  try { localStorage.setItem(PRESET_KEY, JSON.stringify(presets)); } catch {}
}

function getCurrentConfig() {
  syncLensDataFromDOM();
  const rawW0 = parseFloat(document.getElementById('w0').value);
  const rawW0y = parseFloat(document.getElementById('w0y').value);
  const isFwhm = document.getElementById('showFwhm').checked;
  return {
    wavelength: document.getElementById('wavelength').value,
    // Always store as 1/e² radius.
    w0: isFwhm ? (rawW0 / FWHM_FACTOR).toFixed(6) : '' + rawW0,
    w0y: isFwhm ? (rawW0y / FWHM_FACTOR).toFixed(6) : '' + rawW0y,
    M2: document.getElementById('M2').value,
    R0: document.getElementById('R0').value,
    R0y: document.getElementById('R0y').value,
    totalLength: document.getElementById('totalLength').value,
    samples: document.getElementById('samples').value,
    lenses: JSON.parse(JSON.stringify(lensData)),
    isFwhm: isFwhm ? 1 : 0
  };
}

function applyConfig(cfg) {
  document.getElementById('wavelength').value = cfg.wavelength;
  document.getElementById('M2').value = cfg.M2;
  document.getElementById('R0').value = cfg.R0;
  document.getElementById('R0y').value = cfg.R0y;
  document.getElementById('totalLength').value = cfg.totalLength;
  document.getElementById('samples').value = cfg.samples;
  document.getElementById('showFwhm').checked = !!cfg.isFwhm;
  const factor = cfg.isFwhm ? FWHM_FACTOR : 1;
  document.getElementById('w0').value = (parseFloat(cfg.w0) * factor).toFixed(4);
  document.getElementById('w0y').value = (parseFloat(cfg.w0y) * factor).toFixed(4);
  lensData = JSON.parse(JSON.stringify(cfg.lenses));
  renderLenses();
}

function populatePresetMenu() {
  const sel = document.getElementById('presetSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— Select —</option>';
  const presets = loadPresets();
  for (const p of presets) {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name;
    sel.appendChild(opt);
  }
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

function savePreset() {
  const presets = loadPresets();
  const existingNames = presets.map(p => p.name);
  let name = prompt('Preset name:');
  if (!name || !name.trim()) return;
  name = name.trim();
  // Allow overwriting an existing preset by using the same name.
  const idx = existingNames.indexOf(name);
  const cfg = getCurrentConfig();
  if (idx !== -1) {
    presets[idx] = { name, ...cfg };
  } else {
    presets.push({ name, ...cfg });
  }
  savePresets(presets);
  populatePresetMenu();
  document.getElementById('presetSelect').value = name;
}

function loadPreset() {
  const sel = document.getElementById('presetSelect');
  const name = sel.value;
  if (!name) return;
  const presets = loadPresets();
  const p = presets.find(x => x.name === name);
  if (!p) return;
  applyConfig(p);
  update();
}

function deletePreset() {
  const sel = document.getElementById('presetSelect');
  const name = sel.value;
  if (!name) return;
  if (!confirm('Delete preset "' + name + '"?')) return;
  let presets = loadPresets();
  presets = presets.filter(p => p.name !== name);
  savePresets(presets);
  populatePresetMenu();
}

// Seed defaults if no presets exist.
(function seedPresets() {
  if (loadPresets().length > 0) return;
  savePresets([
    {
      name: 'Default (2 lenses)',
      wavelength: '633', w0: '0.5', w0y: '0.5', M2: '1', R0: '0', R0y: '0',
      totalLength: '300', samples: '4096',
      lenses: [{ pos: 100, fx: 25, fy: 25, active: true }, { pos: 200, fx: 75, fy: 75, active: true }], isFwhm: 0
    },
    {
      name: 'Telescope (4f)',
      wavelength: '633', w0: '0.5', w0y: '0.5', M2: '1', R0: '0', R0y: '0',
      totalLength: '400', samples: '4096',
      lenses: [{ pos: 100, fx: 100, fy: 100, active: true }, { pos: 300, fx: 100, fy: 100, active: true }], isFwhm: 0
    },
    {
      name: 'Astigmatic beam + lenses',
      wavelength: '532', w0: '0.8', w0y: '0.4', M2: '1', R0: '0', R0y: '0',
      totalLength: '500', samples: '4096',
      lenses: [{ pos: 150, fx: 80, fy: 60, active: true }, { pos: 300, fx: 50, fy: 100, active: true }], isFwhm: 0
    }
  ]);
})();

// ══════════════════════════════════════════════════════════════
// Main update pipeline
//
// Called on every user interaction (Recalculate button, checkbox
// toggle, Enter key, add/remove lens, window resize).  The
// pipeline is:
//   1. Read all inputs
//   2. Run the ABCD propagation
//   3. Render the plots
//   4. Set up mouse tracking (rebinds the canvas events)
//   5. Populate the results table
// ══════════════════════════════════════════════════════════════
function update() {
  const wavelength = parseFloat(document.getElementById('wavelength').value) * 1e-6;
  const rawW0 = parseFloat(document.getElementById('w0').value);
  const rawW0y = parseFloat(document.getElementById('w0y').value);
  const M2 = parseFloat(document.getElementById('M2').value);
  const R0 = parseFloat(document.getElementById('R0').value);
  const R0y = parseFloat(document.getElementById('R0y').value);
  const totalLen = parseFloat(document.getElementById('totalLength').value);
  const nSamples = parseInt(document.getElementById('samples').value);
  const showR = true;
  const showGrid = document.getElementById('showGrid').checked;
  const showInvR = document.getElementById('showInvR').checked;
  const showPhase = document.getElementById('showPhase').checked;
  const showPoints = document.getElementById('showPoints').checked;
  const showFwhm = document.getElementById('showFwhm').checked;
  const showWaistTrack = document.getElementById('showWaistTrack').checked;
  const w0 = showFwhm ? rawW0 / FWHM_FACTOR : rawW0;
  const w0y = showFwhm ? rawW0y / FWHM_FACTOR : rawW0y;

  const lenses = readLenses();

  if (!w0 || w0 <= 0 || !totalLen || totalLen <= 0 || !nSamples || nSamples < 10) return;

  const lensesX = lenses.map(l => ({ pos: l.pos, f: l.fx, active: l.active }));
  const lensesY = lenses.map(l => ({ pos: l.pos, f: l.fy, active: l.active }));
  const dataX = propagate(wavelength, w0, R0, lensesX, totalLen, nSamples, M2);
  const hasAstigmaticLenses = lenses.some(l => l.fx !== l.fy);
  const dataY = (w0y !== w0 || R0y !== R0 || hasAstigmaticLenses) ? propagate(wavelength, w0y, R0y, lensesY, totalLen, nSamples, M2) : null;
  const dataWT = showWaistTrack ? propagateWaistTracking(dataX.zValues, w0, R0, lensesX, wavelength, M2) : null;
  const xWaists = findExactWaists(dataX.zValues, dataX.wValues, dataX.RValues, wavelength, M2);
  const yWaists = dataY ? findExactWaists(dataX.zValues, dataY.wValues, dataY.RValues, wavelength, M2) : [];
  const waistMarkers = { x: xWaists, y: yWaists };
  const canvas = document.getElementById('plotCanvas');
  drawPlot(canvas, dataX, lenses, { showR, showGrid, showInvR, showPhase, showPoints, showFwhm, zoomRange, waistMarkers }, dataY, dataWT);
  setupMouseTracking(canvas, dataX, lenses, { showR, showInvR, showPhase, showFwhm, zoomRange }, dataY, dataWT);
  updateResults(dataX, lenses, totalLen, dataY, wavelength, M2, showFwhm);

  // Show the Reset Zoom button only when a zoom is active.
  document.getElementById('resetZoomBtn').style.display = zoomRange ? '' : 'none';
}

// ══════════════════════════════════════════════════════════════
// Event wiring & initialisation
// ══════════════════════════════════════════════════════════════

// Buttons and checkboxes trigger a full recalculation.
document.getElementById('recalcBtn').addEventListener('click', update);
document.getElementById('showGrid').addEventListener('change', update);
document.getElementById('showInvR').addEventListener('change', update);
document.getElementById('showPhase').addEventListener('change', update);
document.getElementById('showPoints').addEventListener('change', update);
document.getElementById('showFwhm').addEventListener('change', () => {
  const isFwhm = document.getElementById('showFwhm').checked;
  const w0Input = document.getElementById('w0');
  const w0yInput = document.getElementById('w0y');
  w0Input.value = isFwhm ? (parseFloat(w0Input.value) * FWHM_FACTOR).toFixed(4) : (parseFloat(w0Input.value) / FWHM_FACTOR).toFixed(4);
  w0yInput.value = isFwhm ? (parseFloat(w0yInput.value) * FWHM_FACTOR).toFixed(4) : (parseFloat(w0yInput.value) / FWHM_FACTOR).toFixed(4);
});

// Preset controls.
document.getElementById('presetSelect').addEventListener('change', loadPreset);
document.getElementById('savePresetBtn').addEventListener('click', savePreset);
document.getElementById('deletePresetBtn').addEventListener('click', deletePreset);

// Reset-zoom: return to the full propagation range.
document.getElementById('resetZoomBtn').addEventListener('click', () => {
  zoomRange = null;
  update();
});

// Add-lens button: snapshot the current lens values, push a new lens
// (default position = last lens + 80 mm, f = 60 mm, active), re-render
// the controls, and recalculate.
document.getElementById('addLensBtn').addEventListener('click', () => {
  if (lensData.length >= 10) return;
  syncLensDataFromDOM();
  const lastPos = lensData.length > 0 ? lensData[lensData.length - 1].pos : 0;
  lensData.push({ pos: lastPos + 80, fx: 60, fy: 60, active: true });
  renderLenses();
  update();
});

// Change (spinner arrows, Enter, blur) triggers recalculation.
// Static inputs are wired directly.
document.querySelectorAll('input').forEach(inp => {
  inp.addEventListener('change', update);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') update(); });
});
// Dynamic lens inputs use event delegation because they are recreated
// every time the lens list changes.
document.getElementById('lensContainer').addEventListener('change', (e) => {
  if (e.target.matches('.lens-pos, .lens-fx, .lens-fy, .lens-active')) update();
});
document.getElementById('lensContainer').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('.lens-pos, .lens-fx, .lens-fy')) update();
});

// Bootstrap: render the initial single-lens controls, then run the
// first propagation + plot once the DOM is fully loaded.
renderLenses();
populatePresetMenu();
window.addEventListener('load', update);
window.addEventListener('resize', update);

// Register service worker for offline PWA support.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
